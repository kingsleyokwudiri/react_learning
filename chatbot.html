<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <div class="js-container2"></div>
    <div class="js-container3"></div>

    <script src="libs/react.js"></script>
    <script src="libs/react-dom.js"></script>
    <script src="libs/babel.js"></script>
    <script src="libs/chatbot.js"></script>
    <script type="text/babel">
      // the component name must start with a capital letter
      // fragment syntax is <></>
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");
        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          const newChatMessage = [
            ...chatMessages,
            { message: inputText, sender: "user", id: crypto.randomUUID() },
          ];
          // Spread Operator (...)
          // takes the values in an array, and copies them into a new array
          setChatMessages(newChatMessage);
          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessage,
            { message: response, sender: "robot", id: crypto.randomUUID() },
          ]);
          setInputText("");
        }

        return (
          <>
            <input placeholder="Send a message to Chatbot" size="30" />
            <button onClick={sendMessage}>Send</button>
            onChange={saveInputText}
            value={inputText}
          </>
        );
      }

      // <div></div> is a block element, it will take up an entire line
      // components are designed to be reusable,
      // so they should be generic and not specific to a single use case
      // props is short for properties,
      //
      // it is an object that contains the data passed to the component
      function ChatMessage({ message, sender }) {
        // or const message = props.message;
        // or const { message, sender } = props;

        // guard operator
        return (
          <div>
            {sender === "robot" && (
              <img src="assets/robot.png" width="50" height="50" />
            )}
            {message}
            {sender === "user" && (
              <img src="assets/user.png" width="50" height="50" />
            )}
          </div>
        );
      }

      // {} is for inserting JS code into JSX
      // component syntax is <ComponentName />, e.g. <ChatInput />
      // {ChatInput()}

      function ChatMessages({ chatMessages }) {
        return (
          <>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "hello chatbot",
            sender: "user",
            id: "id1",
          },
          {
            message: "Hello! How can I help you?",
            sender: "robot",
            id: "id2",
          },
          {
            message: "can you get me todays date?",
            sender: "user",
            id: "id3",
          },
          {
            message: "Today is September 27",
            sender: "robot",
            id: "id4",
          },
        ]);

        // Array Destructuring
        // const [chatMessages, setChatMessages] = array;
        // or
        // const chatMessages = array[0];
        // const setChatMessages = array[1];

        return (
          <>
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
            <ChatMessages chatMessages={chatMessages} />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
