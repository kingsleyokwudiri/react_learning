<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <div class="js-container2"></div>
    <div class="js-container3"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      // the component name must start with a capital letter
      // fragment syntax is <></>
      function ChatInput() {
        return (
          <>
            <input placeholder="Send a message to Chatbot" size="30" />
            <button>Send</button>
          </>
        );
      }

      // <div></div> is a block element, it will take up an entire line
      // components are designed to be reusable,
      // so they should be generic and not specific to a single use case
      // props is short for properties,
      //
      // it is an object that contains the data passed to the component
      function ChatMessage({ message, sender }) {
        // or const message = props.message;
        // or const { message, sender } = props;

        // guard operator
        return (
          <div>
            {sender === "robot" && (
              <img src="assets/robot.png" width="50" height="50" />
            )}
            {message}
            {sender === "user" && (
              <img src="assets/user.png" width="50" height="50" />
            )}
          </div>
        );
      }

      // {} is for inserting JS code into JSX
      // component syntax is <ComponentName />, e.g. <ChatInput />
      // {ChatInput()}

      function ChatMessages() {
        const chatMessages = [
          {
            message: "hello chatbot",
            sender: "user",
            id: "id1",
          },
          {
            message: "Hello! How can I help you?",
            sender: "robot",
            id: "id2",
          },
          {
            message: "can you get me todays date?",
            sender: "user",
            id: "id3",
          },
          {
            message: "Today is September 27",
            sender: "robot",
            id: "id4",
          },
        ];

        function sendMessage() {
          console.log("send message");
        }

        return (
          <>
            <button onClick={sendMessage}>Send message</button>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </>
        );
      }

      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessages />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
