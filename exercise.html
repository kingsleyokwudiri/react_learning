<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="libs/react.js"></script>
    <script src="libs/react-dom.js"></script>
    <script src="libs/babel.js"></script>

    <script type="text/babel">
      // MyButton lives at the top level, like Square and Board in the tictactoe
      // example. A component defined inside another component is a new function
      // on every render, so React unmounts and remounts the whole subtree.
      function MyButton({ count, onClick }) {
        return <button onClick={onClick}>Clicked {count} times</button>;
      }

      function Button() {
        const [count, setCount] = React.useState(0);
        function handleClick() {
          setCount(count + 1);
        }
        const resetCount = () => {
          setCount(0);
        };

        return (
          <>
            <MyButton count={count} onClick={handleClick} />
            <MyButton count={count} onClick={handleClick} />
            <button onClick={resetCount}>Reset</button>
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<Button />);
    </script>
  </body>
</html>
