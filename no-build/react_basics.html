<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Basics</title>
    <link rel="stylesheet" href="react_basics.css" />
  </head>
  <body>
    <div class="js-container"></div>

    <script src="libs/react.js"></script>
    <script src="libs/react-dom.js"></script>
    <script src="libs/babel.js"></script>
    <script src="libs/dayjs.js"></script>

    <script type="text/babel">
      // JSX: use {} for JS expressions
      function Clock() {
        // Initial value: a formatted time string
        const [time, setTime] = React.useState(dayjs().format("HH:mm:ss"));

        // The empty [] dependency array runs this once, after the first render.
        // Exercise 4g: delete the [] and watch how often "run code" logs.
        React.useEffect(() => {
          setInterval(() => {
            console.log("run code");
            setTime(dayjs().format("HH:mm:ss"));
          }, 1000);
        });

        return <p>Current time: {time}</p>;
      }
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<Clock />);
    </script>
  </body>
</html>
